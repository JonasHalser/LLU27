name: LLU27 SQL-Migration ausführen

on:
  workflow_dispatch:
    inputs:
      sql_files:
        description: "SQL-Dateien aus backyard_private/sql, kommasepariert oder je Zeile eine Datei; Reihenfolge wird beibehalten"
        required: true
        default: ""
        type: string
      confirmation:
        description: "Zur Bestätigung exakt APPLY eingeben"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: llu27-production-database
  cancel-in-progress: false

jobs:
  migrate:
    name: SQL mit vorherigem Backup anwenden
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: main

      - name: SQL-Dateiliste validieren
        id: migration
        env:
          SQL_FILES_RAW: ${{ inputs.sql_files }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Migrationen dürfen ausschließlich vom main-Branch gestartet werden." >&2
            exit 1
          fi

          if [ "$CONFIRMATION" != "APPLY" ]; then
            echo "Bestätigung fehlt: Bitte exakt APPLY eingeben." >&2
            exit 1
          fi

          mapfile -t SQL_FILES < <(printf '%s' "$SQL_FILES_RAW" | tr ',\r\t ' '\n\n\n\n' | sed '/^$/d')
          if [ "${#SQL_FILES[@]}" -eq 0 ] || [ "${#SQL_FILES[@]}" -gt 20 ]; then
            echo "Bitte 1 bis 20 SQL-Dateien angeben." >&2
            exit 1
          fi

          declare -A SEEN=()
          for SQL_FILE in "${SQL_FILES[@]}"; do
            if [[ ! "$SQL_FILE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.sql$ ]]; then
              echo "Ungültiger SQL-Dateiname: $SQL_FILE" >&2
              exit 1
            fi
            if [[ -n "${SEEN[$SQL_FILE]:-}" ]]; then
              echo "SQL-Datei doppelt angegeben: $SQL_FILE" >&2
              exit 1
            fi
            SEEN[$SQL_FILE]=1
            SQL_PATH="backyard_private/sql/$SQL_FILE"
            test -f "$SQL_PATH"
            git ls-files --error-unmatch -- "$SQL_PATH" >/dev/null
          done

          {
            echo "sql_files<<SQL_FILE_LIST_EOF"
            printf '%s\n' "${SQL_FILES[@]}"
            echo "SQL_FILE_LIST_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: SSH vorbereiten
        env:
          DEPLOY_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Server und Werkzeuge prüfen
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'test -f domains/zjung-partyband.de/backyard_private/.env &&
             test -f domains/zjung-partyband.de/backyard_private/app/bootstrap.php &&
             command -v php && command -v mysql && command -v mysqldump'

      - name: SQL-Dateien übertragen
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SQL_FILES: ${{ steps.migration.outputs.sql_files }}
        run: |
          set -euo pipefail
          REMOTE_DIR="domains/zjung-partyband.de/backyard_private/.migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SSH_OPTIONS=(-i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${SSH_OPTIONS[@]}" "$SSH_USER@$SSH_HOST" "mkdir -m 700 -p '$REMOTE_DIR'"
          while IFS= read -r SQL_FILE; do
            [ -n "$SQL_FILE" ] || continue
            scp -i ~/.ssh/id_ed25519 \
              -P "$SSH_PORT" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              "backyard_private/sql/$SQL_FILE" \
              "$SSH_USER@$SSH_HOST:$REMOTE_DIR/$SQL_FILE"
          done <<< "$SQL_FILES"

      - name: Je Datei Backup erstellen und Migrationen anwenden
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SQL_FILES: ${{ steps.migration.outputs.sql_files }}
        run: |
          set -euo pipefail
          REMOTE_DIR="domains/zjung-partyband.de/backyard_private/.migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mapfile -t SQL_FILE_LIST <<< "$SQL_FILES"

          ssh -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- "$REMOTE_DIR" "${SQL_FILE_LIST[@]}" <<'REMOTE_SCRIPT'
          set -euo pipefail
          REMOTE_DIR_REL="$1"
          shift
          SQL_FILES=("$@")
          BASE="$HOME/domains/zjung-partyband.de"
          PRIVATE_DIR="$BASE/backyard_private"
          REMOTE_DIR="$HOME/$REMOTE_DIR_REL"
          cleanup() { rm -f "$REMOTE_DIR"/*.sql; rmdir "$REMOTE_DIR" 2>/dev/null || true; }
          trap cleanup EXIT

          cd "$PRIVATE_DIR"
          read_cfg() {
            php -r 'require "app/bootstrap.php"; echo cfg($argv[1], $argv[2] ?? "");' "$1" "${2:-}"
          }

          DB_HOST="$(read_cfg DB_HOST localhost)"
          DB_PORT="$(read_cfg DB_PORT 3306)"
          DB_NAME="$(read_cfg DB_NAME)"
          DB_USER="$(read_cfg DB_USER)"
          DB_PASS="$(read_cfg DB_PASS)"
          test -n "$DB_NAME"
          test -n "$DB_USER"

          BACKUP_DIR="$PRIVATE_DIR/backups"
          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"
          for SQL_FILE in "${SQL_FILES[@]}"; do
            REMOTE_SQL="$REMOTE_DIR/$SQL_FILE"
            test -s "$REMOTE_SQL"
            BACKUP_FILE="$BACKUP_DIR/$(date -u +%Y%m%dT%H%M%SZ)-before-${SQL_FILE%.sql}.sql"
            DUMP_OPTIONS=(
              --host="$DB_HOST"
              --port="$DB_PORT"
              --user="$DB_USER"
              --default-character-set=utf8mb4
              --single-transaction
              --quick
              --skip-lock-tables
            )
            if mysqldump --help 2>/dev/null | grep -q -- '--no-tablespaces'; then
              DUMP_OPTIONS+=(--no-tablespaces)
            fi
            MYSQL_PWD="$DB_PASS" mysqldump "${DUMP_OPTIONS[@]}" "$DB_NAME" > "$BACKUP_FILE"
            chmod 600 "$BACKUP_FILE"
            test -s "$BACKUP_FILE"

            MYSQL_PWD="$DB_PASS" mysql \
              --host="$DB_HOST" \
              --port="$DB_PORT" \
              --user="$DB_USER" \
              --default-character-set=utf8mb4 \
              --show-warnings \
              "$DB_NAME" < "$REMOTE_SQL"

            echo "Migration erfolgreich: $SQL_FILE"
            echo "Backup erstellt: $BACKUP_FILE"
          done
          REMOTE_SCRIPT

      - name: Zusammenfassung
        env:
          SQL_FILES: ${{ steps.migration.outputs.sql_files }}
        run: |
          {
            echo "### SQL-Migrationen erfolgreich"
            echo
            echo "Ausgeführt:"
            while IFS= read -r SQL_FILE; do
              [ -n "$SQL_FILE" ] && echo "- \`$SQL_FILE\`"
            done <<< "$SQL_FILES"
            echo
            echo "Vor jeder Datei wurde auf dem Server ein privates Datenbank-Backup erstellt."
          } >> "$GITHUB_STEP_SUMMARY"
